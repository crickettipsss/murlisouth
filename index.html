<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURLI SOUTH INDIA | Telegram</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  background:
    radial-gradient(ellipse at top left, #180d0b, transparent 48%),
    radial-gradient(ellipse at bottom right, #00302f, transparent 45%),
    #030811;
  color: #f1f5ff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 0;
}

.card {
  width: calc(100% - 40px);
  max-width: 650px;
  background: linear-gradient(145deg, #08121e, #050d18);
  border: 1px solid #263a49;
  border-radius: 52px;
  padding: 50px 36px 44px;
  text-align: center;
  box-shadow: 0 0 35px rgba(0, 210, 255, 0.06);
}

.logo-wrap {
  width: 218px;
  height: 218px;
  margin: 0 auto 38px;
  border-radius: 50%;
  padding: 7px;
  background: linear-gradient(135deg, #d9e5d9, #00d9ff);
  box-shadow: 0 0 25px rgba(0, 220, 255, 0.25);
}

.logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #07111d;
}

.verified {
  display: inline-flex;
  align-items: center;
  gap: 13px;
  border: 1px solid #007f96;
  border-radius: 35px;
  padding: 12px 25px;
  color: #00d9f5;
  font-size: 22px;
  margin-bottom: 39px;
  background: rgba(0, 180, 210, 0.06);
}

.check {
  border: 3px solid #00d9f5;
  width: 30px;
  height: 30px;
  line-height: 25px;
  border-radius: 50%;
  font-weight: bold;
}

h1 {
  font-size: 43px;
  font-weight: 700;
  margin-bottom: 17px;
}

.fire {
  font-size: 49px;
  margin-bottom: 27px;
}

.description {
  color: #aeb8c8;
  font-size: 25px;
  line-height: 1.75;
  margin-bottom: 42px;
}

.join-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
  min-height: 98px;
  border-radius: 35px;
  background: linear-gradient(100deg, #009ee9, #08c4e9);
  color: white;
  text-decoration: none;
  font-size: 29px;
  box-shadow: 0 8px 25px rgba(0, 180, 255, 0.17);
}

.join-btn svg {
  width: 32px;
  height: 32px;
  fill: white;
}

.access {
  color: #8995a5;
  font-size: 21px;
  margin-top: 31px;
  margin-bottom: 51px;
}

.footer {
  border-top: 1px solid #263342;
  padding-top: 34px;
  color: #8490a1;
  font-size: 19px;
}

@media(max-width: 480px) {
  .card {
    padding: 38px 25px 36px;
    border-radius: 40px;
  }

  .logo-wrap {
    width: 190px;
    height: 190px;
    margin-bottom: 35px;
  }

  .verified {
    font-size: 18px;
    padding: 10px 18px;
    margin-bottom: 35px;
  }

  h1 {
    font-size: 34px;
  }

  .description {
    font-size: 20px;
    line-height: 1.7;
  }

  .join-btn {
    min-height: 85px;
    font-size: 23px;
  }

  .access {
    font-size: 17px;
  }

  .footer {
    font-size: 15px;
  }
}

@media(max-width: 360px) {
  .card {
    padding-left: 19px;
    padding-right: 19px;
  }

  .logo-wrap {
    width: 165px;
    height: 165px;
  }

  h1 {
    font-size: 30px;
  }

  .description {
    font-size: 18px;
  }

  .join-btn {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo-wrap">
    <img src="logo.jpg" alt="Murli South India Logo">
  </div>

  <div class="verified">
    <span class="check">✓</span>
    Cricket Updates Channel
  </div>

  <h1>MURLI SOUTH INDIA</h1>

  <div class="fire">🔥</div>

  <p class="description">
    Exclusive cricket insights, match analysis, and
    live updates shared inside our Telegram channel.
  </p>

  <a class="join-btn"
     href="https://t.me/+2puB_HChLTU1NmQ1"
     target="_blank"
     rel="noopener noreferrer">

    <svg viewBox="0 0 24 24">
      <path d="M21.9 3.1 18.7 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.6.6-1.2.6l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.7l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.8 3c.9-.3 1.5.2 1.1 1.1z"/>
    </svg>

    Join on Telegram
  </a>

  <div class="access">
    Click above to access the channel
  </div>

  <div class="footer">
    © 2026 MURLI SOUTH INDIA · Independent cricket channel
  </div>

</div>

</body>
</html>
