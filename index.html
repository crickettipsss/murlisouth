<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030811">
<title>MURLI SOUTH INDIA | Telegram</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  min-height:100svh;
  background:
    radial-gradient(ellipse at top left,#180d0b,transparent 50%),
    radial-gradient(ellipse at bottom right,#00302f,transparent 50%),
    #030811;
  color:#f1f5ff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 0;
}

.card{
  width:calc(100% - 40px);
  max-width:650px;
  background:linear-gradient(145deg,#08121e,#050d18);
  border:1px solid #263a49;
  border-radius:38px;
  padding:clamp(18px,3.5svh,32px) 22px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,210,255,.06);
}

.logo-wrap{
  width:min(29vw,20svh,165px);
  aspect-ratio:1;
  margin:0 auto clamp(18px,3svh,28px);
  padding:5px;
  border-radius:50%;
  background:linear-gradient(135deg,#d9e5d9,#00d9ff);
  box-shadow:0 0 20px rgba(0,220,255,.25);
}

.logo-wrap img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #07111d;
}

.verified{
  display:inline-flex;
  align-items:center;
  gap:9px;
  border:1px solid #007f96;
  border-radius:30px;
  padding:9px 17px;
  color:#00d9f5;
  font-size:clamp(14px,4vw,18px);
  margin-bottom:clamp(20px,3.5svh,30px);
  background:rgba(0,180,210,.06);
}

.check{
  border:2px solid #00d9f5;
  width:24px;
  height:24px;
  line-height:21px;
  border-radius:50%;
  font-weight:bold;
  flex-shrink:0;
}

h1{
  font-size:clamp(25px,7vw,34px);
  font-weight:700;
  margin-bottom:10px;
}

.fire{
  font-size:35px;
  margin-bottom:15px;
}

.description{
  color:#aeb8c8;
  font-size:clamp(15px,4.2vw,19px);
  line-height:1.65;
  margin-bottom:clamp(20px,3.5svh,30px);
}

.join-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  width:100%;
  min-height:clamp(58px,9svh,78px);
  border-radius:27px;
  background:linear-gradient(100deg,#009ee9,#08c4e9);
  color:white;
  text-decoration:none;
  font-size:clamp(19px,5vw,23px);
  box-shadow:0 6px 20px rgba(0,180,255,.17);
}

.join-btn svg{
  width:25px;
  height:25px;
  fill:white;
  flex-shrink:0;
}

.access{
  color:#8995a5;
  font-size:15px;
  margin:19px 0 30px;
}

.footer{
  border-top:1px solid #263342;
  padding-top:24px;
  color:#8490a1;
  font-size:13px;
  line-height:1.5;
}

/* Small mobile screens */
@media(max-width:380px){
  .card{
    width:calc(100% - 32px);
    padding-left:17px;
    padding-right:17px;
  }

  h1{
    font-size:27px;
  }

  .description{
    font-size:16px;
  }
}

/* Short mobile screens */
@media(max-height:750px){
  .card{
    padding-top:15px;
    padding-bottom:15px;
  }

  .logo-wrap{
    width:min(25vw,15svh,125px);
    margin-bottom:12px;
  }

  .verified{
    margin-bottom:15px;
  }

  .fire{
    margin-bottom:8px;
  }

  .description{
    margin-bottom:15px;
    line-height:1.45;
  }

  .access{
    margin:12px 0 18px;
  }

  .footer{
    padding-top:15px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGO -->
  <div class="logo-wrap">
    <img src="logo.jpg" alt="Murli South India Logo">
  </div>

  <!-- CHANNEL LABEL -->
  <div class="verified">
    <span class="check">✓</span>
    Cricket Updates Channel
  </div>

  <!-- CHANNEL NAME -->
  <h1>MURLI SOUTH INDIA</h1>

  <div class="fire">🔥</div>

  <!-- DESCRIPTION -->
  <p class="description">
    Exclusive cricket insights, match analysis, and
    live updates shared inside our Telegram channel.
  </p>

  <!-- TELEGRAM BUTTON -->
  <a class="join-btn"
     href="https://t.me/+2puB_HChLTU1NmQ1"
     target="_blank"
     rel="noopener noreferrer">

    <svg viewBox="0 0 24 24">
      <path d="M21.9 3.1 18.7 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.6.6-1.2.6l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.7l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.8 3c.9-.3 1.5.2 1.1 1.1z"/>
    </svg>

    Join on Telegram
  </a>

  <div class="access">
    Click above to access the channel
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 MURLI SOUTH INDIA · Independent cricket channel
  </div>

</div>

</body>
</html>
